[project]
name = "librarian-agno"
version = "1.0.5"
description = "Agente conversacional do Librarian sobre a API interna de busca"
requires-python = ">=3.12"
dependencies = [
    "agno[app]>=2.6.18",
    "fastapi>=0.137.2",
    "groq>=0.11.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    # Exigido pelo router de agentes do AgentOS, que declara endpoints com
    # form data. Sem isso o app quebra no import, não em runtime.
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.49.0",
]
